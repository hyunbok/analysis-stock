name: Flutter CI

on:
  push:
    branches: [main, develop]
    paths: ['client/**']
  pull_request:
    branches: [main, develop]
    paths: ['client/**']

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          cache: true
      - run: cd client && flutter pub get
      - run: cd client && flutter analyze

  test:
    runs-on: ubuntu-latest
    needs: [analyze]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          cache: true
      - run: cd client && flutter pub get
      - run: cd client && flutter test --coverage
      - uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: client/coverage/lcov.info

  build-apk:
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          cache: true
      - run: cd client && flutter pub get
      - run: cd client && flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: client/build/app/outputs/flutter-apk/app-release.apk
