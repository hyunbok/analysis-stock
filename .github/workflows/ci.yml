name: Server CI

on:
  push:
    branches: [main, develop]
    paths: ['server/**']
  pull_request:
    branches: [main, develop]
    paths: ['server/**']

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install ruff
      - run: ruff check server/app/ server/tests/

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r server/requirements.txt mypy pydantic
      - run: cd server && mypy app/

  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r server/requirements.txt && pip install pytest pytest-asyncio pytest-cov httpx mongomock-motor "fakeredis[aioredis]"
      - run: cd server && pytest tests/unit/ tests/trading/ -v --cov=app --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: unit-coverage
          path: server/coverage.xml

  integration-test:
    runs-on: ubuntu-latest
    needs: [lint, type-check]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cointrader
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: cointrader_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://cointrader:testpassword@localhost:5432/cointrader_test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r server/requirements.txt && pip install pytest pytest-asyncio pytest-cov httpx mongomock-motor "fakeredis[aioredis]"
      - run: cd server && pytest tests/integration/ -v --cov=app --cov-report=xml --cov-append
      - uses: actions/upload-artifact@v4
        with:
          name: integration-coverage
          path: server/coverage.xml

  e2e-test:
    runs-on: ubuntu-latest
    needs: [integration-test]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cointrader
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: cointrader_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      mongodb:
        image: mongo:7
        env:
          MONGO_INITDB_ROOT_USERNAME: cointrader
          MONGO_INITDB_ROOT_PASSWORD: testpassword
        ports: ['27017:27017']
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://cointrader:testpassword@localhost:5432/cointrader_test
      MONGODB_URL: mongodb://cointrader:testpassword@localhost:27017/cointrader_test?authSource=admin
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: test-secret-key-for-ci
      TOTP_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      EXCHANGE_API_KEY_SECRET: "fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r server/requirements.txt && pip install pytest pytest-asyncio pytest-cov httpx mongomock-motor "fakeredis[aioredis]"
      - run: cd server && pytest tests/e2e/ -v --cov=app --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: e2e-coverage
          path: server/coverage.xml

  coverage:
    runs-on: ubuntu-latest
    needs: [unit-test, integration-test, e2e-test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install coverage
      - uses: actions/download-artifact@v4
        with:
          name: unit-coverage
          path: artifacts/unit
      - uses: actions/download-artifact@v4
        with:
          name: integration-coverage
          path: artifacts/integration
      - uses: actions/download-artifact@v4
        with:
          name: e2e-coverage
          path: artifacts/e2e
      - name: Merge coverage reports
        run: |
          python -c "
          import xml.etree.ElementTree as ET
          import sys

          files = ['artifacts/unit/coverage.xml', 'artifacts/integration/coverage.xml', 'artifacts/e2e/coverage.xml']
          total_stmts, total_miss = 0, 0
          for f in files:
              try:
                  tree = ET.parse(f)
                  root = tree.getroot()
                  for pkg in root.findall('.//package'):
                      for cls in pkg.findall('.//class'):
                          stmts = int(cls.get('complexity', 0)) or len(cls.findall('.//line'))
                  # Use top-level coverage stats
                  cov = root.attrib
                  total_stmts += int(float(cov.get('lines-valid', 0)))
                  total_miss += int(float(cov.get('lines-valid', 0))) - int(float(cov.get('lines-covered', 0)))
              except Exception as e:
                  print(f'Warning: {f}: {e}')
          if total_stmts == 0:
              print('No coverage data found')
              sys.exit(1)
          pct = ((total_stmts - total_miss) / total_stmts) * 100
          print(f'Combined coverage: {pct:.1f}% ({total_stmts - total_miss}/{total_stmts} lines)')
          if pct < 80:
              print(f'FAIL: Coverage {pct:.1f}% < 80%')
              sys.exit(1)
          print('PASS: Coverage meets threshold')
          "
