name: Nightly Performance Tests

on:
  schedule:
    - cron: '0 18 * * *'  # 매일 03:00 KST (18:00 UTC)
  workflow_dispatch:

jobs:
  performance-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cointrader
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: cointrader_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      mongodb:
        image: mongo:7
        env:
          MONGO_INITDB_ROOT_USERNAME: cointrader
          MONGO_INITDB_ROOT_PASSWORD: testpassword
        ports: ['27017:27017']
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://cointrader:testpassword@localhost:5432/cointrader_test
      MONGODB_URL: mongodb://cointrader:testpassword@localhost:27017/cointrader_test?authSource=admin
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: test-secret-key-for-ci
      TOTP_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      EXCHANGE_API_KEY_SECRET: "fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r server/requirements.txt && pip install pytest pytest-asyncio pytest-benchmark httpx locust "locust-plugins>=4.0" mongomock-motor "fakeredis[aioredis]"
      - name: Run performance benchmarks
        run: cd server && pytest tests/performance/ -v -m benchmark --benchmark-json=benchmark.json
      - name: Run locust load test
        run: |
          cd server
          if [ -f tests/performance/locustfile.py ]; then
            locust -f tests/performance/locustfile.py \
              --headless \
              --users 100 \
              --spawn-rate 10 \
              --run-time 60s \
              --html locust-report.html \
              --host http://localhost:8000 \
              || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-results
          path: |
            server/benchmark.json
            server/locust-report.html
