name: Security Scan

on:
  schedule:
    - cron: '0 6 * * 1'  # 매주 월요일 06:00 UTC
  push:
    branches: [main]
    paths:
      - 'server/requirements.txt'
      - 'server/pyproject.toml'

jobs:
  dependency-scan:
    name: Python Dependency Scan (safety)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install safety
        run: pip install safety

      - name: Check dependencies for known vulnerabilities
        run: safety check -r server/requirements.txt

  container-scan:
    name: Container Scan (Trivy)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image for scanning (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: false
          tags: scan-target:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: scan-target:latest
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Upload Trivy SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  secret-scan:
    name: Secret Scan (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog OSS secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified
